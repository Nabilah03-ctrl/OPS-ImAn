<!doctype html>
<html lang="ms-MY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semakan gambar dan soalan · OPS ImAn</title><link rel="icon" href="assets/favicon.svg"><style>
*{box-sizing:border-box}body{font:18px/1.5 system-ui,sans-serif;background:#eef6ff;color:#102a56;margin:0;padding:25px}main{max-width:1250px;margin:auto}a{color:#174beb}h1{font-size:32px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:white;border-radius:20px;padding:20px;border:2px solid #c4d8ee}svg{width:100%;height:240px}small{color:#4b6580}.answer{padding:10px;background:#fff3b6;border-radius:10px}h3{margin:8px 0}p{margin:8px 0}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}body{padding:15px}}
</style></head><body><main><a href="./">← Kembali ke permainan</a><h1>Semakan gambar dan soalan</h1><p>Rujukan guru · 30 cabaran · Jawapan dipaparkan untuk semakan.</p><div id="gallery"></div></main><script type="module">
import {ITEMS,LEVELS} from './content.js';import {actionScene} from './station-art.js';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelector('#gallery').innerHTML=LEVELS.map(l=>`<section id="stesen-${l.id}"><h2>Stesen ${l.id} · ${l.subtitle}</h2><div class="cards">${ITEMS.filter(i=>i.level===l.id).map(i=>`<article>${actionScene(i.level,i.index,{label:i.sentence})}<h3>${i.id} · ${esc(i.word)}</h3><p>${esc(i.sentence)}</p><small>Kata dasar: ${i.base} · Awalan: ${i.prefix}</small><p>${esc(i.prompt)}</p><p class="answer">Jawapan: ${esc(i.type==='sentence'?i.sentence:i.answer)}</p></article>`).join('')}</div></section>`).join('');
</script></body></html>
