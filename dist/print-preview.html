<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratonton cetakan · OPS ImAn</title></head>
<body><p role="status">Menyediakan bahan cetakan OPS ImAn…</p>
<script type="module">
import { renderPrintMaterial } from './print.js';
try {
  const params = new URLSearchParams(location.search);
  const html = renderPrintMaterial(params.get('id') || 'kit-cover', {
    ink: params.get('ink') === '1',
    name: params.get('name') || '',
    className: params.get('class') || ''
  });
  document.open();
  document.write(html);
  document.close();
  await Promise.all([...document.images].map(img => img.complete ? Promise.resolve() : new Promise(resolve => {img.onload = resolve; img.onerror = resolve;})));
  await document.fonts.ready;
  document.documentElement.dataset.printReady = 'true';
} catch (error) {
  document.body.textContent = 'Bahan tidak dapat disediakan: ' + error.message;
  document.documentElement.dataset.printError = 'true';
}
</script></body></html>
