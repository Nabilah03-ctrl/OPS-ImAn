name: Terbitkan OPS ImAn ke GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kod
        uses: actions/checkout@v6
      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Muat naik permainan siap
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Terbitkan permainan
        id: deployment
        uses: actions/deploy-pages@v4
